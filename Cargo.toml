[package]
name = "nexcord"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "A fast, minimal, high-quality Discord music bot in Rust. No API keys."
license = "GPL-3.0-only"
repository = "https://github.com/nexverse404/nexcord"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "=0.12.4", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "cache",
    "voice",
    "rustls_backend",
] }
songbird = { version = "=0.5.0", default-features = false, features = [
    "driver",
    "gateway",
    "rustls",
    "serenity",
    "tungstenite",
] }
toml = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "process",
    "sync",
    "time",
    "fs",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Small binary, fast startup, low memory: no framework, no built-in queue,
# no heavyweight runtimes. Everything is async and lazily instantiated.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
